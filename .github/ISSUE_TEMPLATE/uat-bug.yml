name: UAT bug
description: Something wrong found while using the app (gym pilot or manual test)
labels: ["uat-bug", "defect"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Screen / module
      options: [Auth, Workouts, Sessions, Check-in, Results, Board, Achievements, TV, Member app, Admin, Notifications, Other]
    validations: {required: true}
  - type: input
    id: role
    attributes: {label: Logged in as (member / trainer / owner / TV)}
  - type: input
    id: device
    attributes: {label: Device and OS / browser (e.g. iPhone 15, iOS 26.1 · Chrome on the gym TV)}
  - type: textarea
    id: steps
    attributes: {label: Steps, placeholder: "1. Open ... 2. Tap ..."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: What happened (paste a screenshot or photo of the TV if you can)}
    validations: {required: true}
